services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    networks: [private]
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]
    depends_on: [relay]
networks:
  private:
volumes:
  caddy_data:
  caddy_config:
