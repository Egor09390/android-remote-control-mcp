name: Build Own VPS Android APK (GMS)

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/selfhost-android-apk
    paths:
      - '.github/workflows/own-vps-apk.yml'
      - 'app/**'
      - 'selfhost/**'
      - 'build.gradle.kts'
      - 'gradle/**'

permissions:
  contents: write

concurrency:
  group: own-vps-android-apk
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build test GMS APK with personal VPS integration
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CLOUDFLARED_GO_VERSION: '1.27.3'
    steps:
      - name: Checkout with submodules and tags
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cloudflared and ngrok native dependencies
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
            app/src/main/jniLibs/arm64-v8a/libngrok_java.so
            app/src/main/jniLibs/x86_64/libngrok_java.so
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: russian-native-v1-${{ hashFiles('.gitmodules', 'Makefile', 'vendor/cloudflared/go.sum', 'vendor/ngrok-java/ngrok-java-native/Cargo.lock') }}

      - name: Build cloudflared Android libraries
        run: |
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libcloudflared.so ] || [ ! -f app/src/main/jniLibs/x86_64/libcloudflared.so ]; then
            make compile-cloudflared
          fi

      - name: Build ngrok Android libraries
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}
        run: |
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libngrok_java.so ] || [ ! -f app/src/main/jniLibs/x86_64/libngrok_java.so ]; then
            make compile-ngrok-native
          fi

      - name: Cache zrok2 Android arm64 executable
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libzrok2.so
          key: android-zrok2-v2.0.9-bionic-arm64-v2

      - name: Build official zrok2 v2.0.9 for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libzrok2.so"
          if [ -s "$OUT" ]; then
            chmod +x "$OUT"
            exit 0
          fi
          NDK_ROOT="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$NDK_ROOT" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
            NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          fi
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          test -x "$CC"

          git clone --depth 1 --branch v2.0.9 https://github.com/openziti/zrok.git "$RUNNER_TEMP/zrok2"
          cd "$RUNNER_TEMP/zrok2"
          EXPECTED="fea58ae4a8126e2a811a57046451049fd8e80e2c"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

          # v2 includes embedded web console assets; build them before Go compilation.
          (cd ui && npm ci && npm run build)
          (cd agent/agentUi && npm ci && npm run build)
          mkdir -p "$(dirname "$OUT")"
          env CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CC" GOFLAGS="-p=2" \
            go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/zrok2
          test -s "$OUT"
          file "$OUT"
          chmod 755 "$OUT"

      - name: Configure release signing
        env:
          RU_KEYSTORE_BASE64: ${{ secrets.RU_KEYSTORE_BASE64 }}
          RU_KEYSTORE_PASSWORD: ${{ secrets.RU_KEYSTORE_PASSWORD }}
          RU_KEY_ALIAS: ${{ secrets.RU_KEY_ALIAS }}
          RU_KEY_PASSWORD: ${{ secrets.RU_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$GITHUB_WORKSPACE/ru-release.jks"
          if [ -n "$RU_KEYSTORE_BASE64" ] && [ -n "$RU_KEYSTORE_PASSWORD" ] && [ -n "$RU_KEY_ALIAS" ] && [ -n "$RU_KEY_PASSWORD" ]; then
            printf '%s' "$RU_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            KEYSTORE_PASSWORD="$RU_KEYSTORE_PASSWORD"
            KEY_ALIAS="$RU_KEY_ALIAS"
            KEY_PASSWORD="$RU_KEY_PASSWORD"
            echo "SIGNING_MODE=owner" >> "$GITHUB_ENV"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_ALIAS="russian-community-release"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 10000 \
              -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -dname "CN=Personal Russian build, O=Android Remote Control MCP"
            echo "SIGNING_MODE=temporary" >> "$GITHUB_ENV"
            echo "::warning::No persistent signing secrets: generated release APKs cannot be upgraded by a later build signed with another key."
          fi
          {
            printf 'storeFile=%s\n' "$KEYSTORE_FILE"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties "$KEYSTORE_FILE"

      - name: Build Russian GMS release APK
        run: ./gradlew --no-daemon assembleGmsRelease -POWN_VPS_TEST_APK=true

      - name: Collect and verify signed GMS release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "app/build/outputs/apk/gms/release/app-gms-release.apk" \
            "release-assets/android-remote-control-mcp-own-vps-gms-test.apk"
          test "$(find release-assets -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "release-assets/android-remote-control-mcp-own-vps-gms-test.apk"
          ls -lh release-assets/

      - name: Upload Russian GMS APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-remote-control-mcp-own-vps-gms-test
          path: release-assets/*.apk
          retention-days: 14
          if-no-files-found: error


      - name: Automatically publish successful APK to the Own VPS GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.txt <<EOF
          Experimental Android APK with zrok2 v2.0.9 public HTTPS tunnel built in for Android arm64; requires a hosted zrok account, no owner-operated VPS.

          Build commit: $GITHUB_SHA
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Unverified on a real VPS. Verify the SSH host fingerprint before
          entering server credentials. Signing key: $SIGNING_MODE.
          Temporary signing keys do not support in-place upgrades from
          previously signed builds; back up settings before reinstalling.
          EOF
          if gh release view own-vps-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload own-vps-preview \
              release-assets/android-remote-control-mcp-own-vps-gms-test.apk \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit own-vps-preview --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.txt \
              --title "Own VPS Android APK (Preview)" --prerelease
          else
            gh release create own-vps-preview \
              release-assets/android-remote-control-mcp-own-vps-gms-test.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Own VPS Android APK (Preview)" \
              --notes-file release-notes.txt --prerelease
          fi
