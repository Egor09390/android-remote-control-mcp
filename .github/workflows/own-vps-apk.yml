name: Build personal S23 APK

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/selfhost-android-apk
    paths:
      - '.github/workflows/own-vps-apk.yml'
      - 'app/**'
      - 'selfhost/**'
      - 'scripts/package-cloudpub.py'
      - 'build.gradle.kts'
      - 'gradle/**'

permissions:
  contents: write

concurrency:
  group: own-vps-android-apk
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Verify and build personal ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CLOUDFLARED_GO_VERSION: '1.27.3'
    steps:
      - name: Checkout with submodules and tags
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust for JVM test dependency
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package official CloudPub Android ARM64 client
        run: python scripts/package-cloudpub.py

      - name: Cache cloudflared and ngrok native dependencies
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
            app/src/main/jniLibs/arm64-v8a/libngrok_java.so
            app/src/main/jniLibs/x86_64/libngrok_java.so
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: russian-native-v1-${{ hashFiles('.gitmodules', 'Makefile', 'vendor/cloudflared/go.sum', 'vendor/ngrok-java/ngrok-java-native/Cargo.lock') }}

      - name: Restore host JNI dependencies for JVM tests
        id: cache-ngrok-host
        uses: actions/cache@v4
        with:
          path: |
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-host.jar
            vendor/ngrok-java/ngrok-java-native/target/release/libngrok_java.so
          key: cloudpub-jvm-host-v1-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/ngrok-java/**/Cargo.lock', 'vendor/ngrok-java/ngrok-java-native/src/**') }}

      - name: Build host JNI dependency for JVM tests
        if: steps.cache-ngrok-host.outputs.cache-hit != 'true'
        working-directory: vendor/ngrok-java
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}
        run: |
          mvn compile -pl ngrok-java-native --also-make --global-toolchains toolchains.xml -q
          mvn package -pl ngrok-java -DskipTests --global-toolchains toolchains.xml -q
          (cd ngrok-java-native/target/classes && jar cf ../ngrok-java-native-classes.jar com/)
          (cd ngrok-java-native && cargo build --release)
          (cd ngrok-java-native/target/release && jar cf ../ngrok-java-native-host.jar libngrok_java.so)

      - name: Test root setup, restore and CloudPub routing
        run: >-
          ./gradlew --no-daemon :app:testFossDebugUnitTest -PPERSONAL_BUILD=true
          --tests '*PersonalSetupScriptsTest'
          --tests '*PersonalSetupTest'
          --tests '*CloudPubTunnelProviderTest'
          --tests '*TunnelManagerTest'
          --tests '*TunnelProviderTypeTest'
          --tests '*SettingsRepositoryImplTest'
          --tests '*SettingsRepositoryLoggingTest'

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudpub-unit-test-reports
          path: app/build/reports/tests/testFossDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure release signing
        env:
          RU_KEYSTORE_BASE64: ${{ secrets.RU_KEYSTORE_BASE64 }}
          RU_KEYSTORE_PASSWORD: ${{ secrets.RU_KEYSTORE_PASSWORD }}
          RU_KEY_ALIAS: ${{ secrets.RU_KEY_ALIAS }}
          RU_KEY_PASSWORD: ${{ secrets.RU_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$GITHUB_WORKSPACE/ru-release.jks"
          if [ -n "$RU_KEYSTORE_BASE64" ] && [ -n "$RU_KEYSTORE_PASSWORD" ] && [ -n "$RU_KEY_ALIAS" ] && [ -n "$RU_KEY_PASSWORD" ]; then
            printf '%s' "$RU_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            KEYSTORE_PASSWORD="$RU_KEYSTORE_PASSWORD"
            KEY_ALIAS="$RU_KEY_ALIAS"
            KEY_PASSWORD="$RU_KEY_PASSWORD"
            echo "SIGNING_MODE=owner" >> "$GITHUB_ENV"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_ALIAS="russian-community-release"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 10000 \
              -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -dname "CN=Personal Russian build, O=Android Remote Control MCP"
            echo "SIGNING_MODE=temporary" >> "$GITHUB_ENV"
            echo "::warning::No persistent signing secrets: generated release APKs cannot be upgraded by a later build signed with another key."
          fi
          {
            printf 'storeFile=%s\n' "$KEYSTORE_FILE"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties "$KEYSTORE_FILE"

      - name: Build personal S23 release APK
        run: ./gradlew --no-daemon assembleFossRelease -POWN_VPS_TEST_APK=true -PPERSONAL_BUILD=true

      - name: Verify personal APK signature and contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/foss/release/app-foss-release.apk release-assets/android-remote-control-mcp-personal-s23.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify release-assets/android-remote-control-mcp-personal-s23.apk
          python - <<'PYCODE'
          import zipfile
          p = 'release-assets/android-remote-control-mcp-personal-s23.apk'
          with zipfile.ZipFile(p) as apk:
              names = apk.namelist()
              assert 'lib/arm64-v8a/libcloudpub.so' in names
              assert not any(n.startswith('assets/geo/') for n in names)
              assert all(not n.startswith('lib/') or n.startswith('lib/arm64-v8a/') for n in names)
              assert not any(n.endswith(('libcloudflared.so', 'libngrok_java.so')) for n in names)
              assert not any(n.startswith('assets/') and n.endswith(('.go', '.mod', '.sum')) for n in names)
          print('ARM64, CloudPub only; no bundled VPS sources or alternative tunnel binaries')
          PYCODE
          ls -lh release-assets/

      - name: Upload personal S23 APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-remote-control-mcp-personal-s23
          path: release-assets/*
          retention-days: 14
          if-no-files-found: error


      - name: Publish verified personal APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.txt <<EOF
          Personal S23 Control: minimal dashboard, root permission setup and CloudPub.
          ARM64 only, without Google Play Services, alternative tunnel binaries or VPS assets.
          Every declared permission is checked against Android, plus accessibility, notification access and background operation.
          Root-only backup preserves app settings, OAuth clients and CloudPub identity across later reinstalls.
          First su authorization depends on the installed root manager. The first CloudPub token must be entered on the phone.
          Root backup is available after the first successful run of this version; it cannot recover data already removed before that.
          Physical Samsung S23 / One UI behavior still requires device verification.

          Build commit: $GITHUB_SHA
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Signing key: $SIGNING_MODE. Back up current settings before reinstalling a differently signed APK.
          Full Google ARTEMIS is not integrated.
          EOF
          if gh release view personal-s23-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload personal-s23-preview release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit personal-s23-preview --repo "$GITHUB_REPOSITORY" --notes-file release-notes.txt --title "S23 Control — Personal" --prerelease
          else
            gh release create personal-s23-preview release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "S23 Control — Personal" --notes-file release-notes.txt --prerelease
          fi
