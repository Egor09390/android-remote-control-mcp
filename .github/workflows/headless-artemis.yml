name: Build S23 Control with screen history

on:
  push:
    branches:
      - feature/client-controlled-artemis
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-history-preview
  cancel-in-progress: true

jobs:
  apk:
    if: github.ref == 'refs/heads/feature/client-controlled-artemis'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNTIME_SHA: 43b2242540ce98e03f944ff72d045dab94f23ba6bde1f829d730e34f6a90cdb3
    steps:
      - name: Verify the previously published ARTEMIS runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/artemis-mcp-preview" \
            --jq '.assets[] | select(.name == "artemis-runtime-ubuntu24.04-arm64.tar.gz" and .state == "uploaded") | .digest')"
          test "$digest" = "sha256:$RUNTIME_SHA"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Rust for the JVM test dependency
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package CloudPub and build the ngrok JVM test dependency
        run: |
          set -euo pipefail
          python scripts/package-cloudpub.py
          export JAVA_11_HOME="$JAVA_HOME" JAVA_17_HOME="$JAVA_HOME"
          cd vendor/ngrok-java
          mvn compile -pl ngrok-java-native --also-make --global-toolchains toolchains.xml -q
          mvn package -pl ngrok-java -DskipTests --global-toolchains toolchains.xml -q
          (cd ngrok-java-native/target/classes && jar cf ../ngrok-java-native-classes.jar com/)
          (cd ngrok-java-native && cargo build --release)
          (cd ngrok-java-native/target/release && jar cf ../ngrok-java-native-host.jar libngrok_java.so)
      - name: Test screen history, screen tools and personal permissions
        run: >-
          ./gradlew --no-daemon :app:testFossDebugUnitTest -PPERSONAL_BUILD=true
          --tests '*McpToolRegistrationTest'
          --tests '*ScreenIntrospectionToolsTest'
          --tests '*ScreenIntrospectionIntegrationTest'
          --tests '*ScreenHistoryTest'
          --tests '*AccessibilityTreeParserTest'
          --tests '*PersonalSetupTest'
      - name: Sign the S23 preview APK
        env:
          RU_KEYSTORE_BASE64: ${{ secrets.RU_KEYSTORE_BASE64 }}
          RU_KEYSTORE_PASSWORD: ${{ secrets.RU_KEYSTORE_PASSWORD }}
          RU_KEY_ALIAS: ${{ secrets.RU_KEY_ALIAS }}
          RU_KEY_PASSWORD: ${{ secrets.RU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/headless-artemis.jks"
          if [[ -n "$RU_KEYSTORE_BASE64" && -n "$RU_KEYSTORE_PASSWORD" && -n "$RU_KEY_ALIAS" && -n "$RU_KEY_PASSWORD" ]]; then
            printf '%s' "$RU_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          else
            RU_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            RU_KEY_PASSWORD="$RU_KEYSTORE_PASSWORD"
            RU_KEY_ALIAS=headless-artemis-preview
            keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 10000 \
              -keystore "$keystore" -storepass "$RU_KEYSTORE_PASSWORD" -keypass "$RU_KEY_PASSWORD" \
              -alias "$RU_KEY_ALIAS" -dname "CN=S23 Control ARTEMIS Preview"
          fi
          trap 'rm -f keystore.properties "$keystore"' EXIT
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$RU_KEYSTORE_PASSWORD" "$RU_KEY_ALIAS" "$RU_KEY_PASSWORD" > keystore.properties
          ./gradlew --no-daemon :app:assembleFossRelease \
            -PPERSONAL_BUILD=true -PARTEMIS_RUNTIME_SHA256="$RUNTIME_SHA"
          mkdir -p dist
          cp app/build/outputs/apk/foss/release/app-foss-release.apk dist/android-mcp-s23-history.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$apksigner" verify dist/android-mcp-s23-history.apk
          python - <<'PY'
          import os
          import zipfile
          with zipfile.ZipFile("dist/android-mcp-s23-history.apk") as apk:
              assert "assets/artemis-supervise.sh" in apk.namelist()
              assert "lib/arm64-v8a/libcloudpub.so" in apk.namelist()
              dex = [apk.read(name) for name in apk.namelist() if name.endswith(".dex")]
              for expected in (b"get_screen_history", b"capture_screenshot", os.environ["RUNTIME_SHA"].encode()):
                  assert any(expected in part for part in dex), expected
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s23-screen-history-apk
          path: dist/android-mcp-s23-history.apk
          compression-level: 0
          if-no-files-found: error

  release:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s23-screen-history-apk
          path: dist
      - name: Publish the S23 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          `android_get_screen_history` показывает смену окон за последние 60 секунд.
          `include_nodes=true` добавляет сохранённые деревья, когда Android успел их отдать.
          Разрешение на показ уведомлений в шторке не требуется для работы MCP.

          S23 Control History устанавливается рядом с предыдущей сборкой. Подключите
          CloudPub в новом приложении и используйте выданный адрес MCP.
          EOF
          gh release create screen-history-preview dist/android-mcp-s23-history.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "S23 Control — Screen History Preview" \
            --prerelease --latest=false --notes-file notes.md
