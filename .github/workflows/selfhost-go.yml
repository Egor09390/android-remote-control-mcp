name: Verify and compile own VPS Go tunnel

on:
  push:
    branches:
      - experiment/selfhost-go-build
      - experiment/selfhost-android-apk
    paths:
      - '.github/workflows/selfhost-go.yml'
      - 'selfhost/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-relay:
    name: Test, vet, compile Go VPS relay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: selfhost
    steps:
      - uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Fetch and verify dependency checksums
        run: |
          go mod download
          go mod verify
      - name: Test with race detector
        run: go test -race -count=1 -v ./...
      - name: Check with go vet
        run: go vet ./...
      - name: Compile Linux x86-64 VPS binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/mcp-selfhost-relay-linux-amd64 .
          test -s dist/mcp-selfhost-relay-linux-amd64
          file dist/mcp-selfhost-relay-linux-amd64
      - name: Compile Linux ARM64 VPS binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/mcp-selfhost-relay-linux-arm64 .
          test -s dist/mcp-selfhost-relay-linux-arm64
          file dist/mcp-selfhost-relay-linux-arm64
      - name: Check Docker build
        run: docker build -t android-mcp-personal-relay:test .
      - name: Upload compiled VPS binaries
        uses: actions/upload-artifact@v4
        with:
          name: own-vps-go-relay-linux-amd64-arm64
          path: selfhost/dist/mcp-selfhost-relay-linux-*
          if-no-files-found: error
          retention-days: 14
