name: Build Russian APK (GMS Release)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/russian-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'gradle/**'

permissions:
  contents: write

concurrency:
  group: russian-apk-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and publish Russian GMS Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CLOUDFLARED_GO_VERSION: '1.27.3'
    steps:
      - name: Checkout with submodules and tags
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cloudflared and ngrok native dependencies
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
            app/src/main/jniLibs/arm64-v8a/libngrok_java.so
            app/src/main/jniLibs/x86_64/libngrok_java.so
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: russian-native-v1-${{ hashFiles('.gitmodules', 'Makefile', 'vendor/cloudflared/go.sum', 'vendor/ngrok-java/ngrok-java-native/Cargo.lock') }}

      - name: Build cloudflared Android libraries
        run: |
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libcloudflared.so ] || [ ! -f app/src/main/jniLibs/x86_64/libcloudflared.so ]; then
            make compile-cloudflared
          fi

      - name: Build ngrok Android libraries
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}
        run: |
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libngrok_java.so ] || [ ! -f app/src/main/jniLibs/x86_64/libngrok_java.so ]; then
            make compile-ngrok-native
          fi

      - name: Configure release signing
        env:
          RU_KEYSTORE_BASE64: ${{ secrets.RU_KEYSTORE_BASE64 }}
          RU_KEYSTORE_PASSWORD: ${{ secrets.RU_KEYSTORE_PASSWORD }}
          RU_KEY_ALIAS: ${{ secrets.RU_KEY_ALIAS }}
          RU_KEY_PASSWORD: ${{ secrets.RU_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$GITHUB_WORKSPACE/ru-release.jks"
          if [ -n "$RU_KEYSTORE_BASE64" ] && [ -n "$RU_KEYSTORE_PASSWORD" ] && [ -n "$RU_KEY_ALIAS" ] && [ -n "$RU_KEY_PASSWORD" ]; then
            printf '%s' "$RU_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            KEYSTORE_PASSWORD="$RU_KEYSTORE_PASSWORD"
            KEY_ALIAS="$RU_KEY_ALIAS"
            KEY_PASSWORD="$RU_KEY_PASSWORD"
            echo "SIGNING_MODE=owner" >> "$GITHUB_ENV"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_ALIAS="russian-community-release"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 10000 \
              -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -dname "CN=Personal Russian build, O=Android Remote Control MCP"
            echo "SIGNING_MODE=temporary" >> "$GITHUB_ENV"
            echo "::warning::No persistent signing secrets: generated release APKs cannot be upgraded by a later build signed with another key."
          fi
          {
            printf 'storeFile=%s\n' "$KEYSTORE_FILE"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties "$KEYSTORE_FILE"

      - name: Build Russian GMS release APK
        run: ./gradlew --no-daemon assembleGmsRelease

      - name: Collect and verify signed GMS release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "app/build/outputs/apk/gms/release/app-gms-release.apk" \
            "release-assets/android-remote-control-mcp-ru-gms-release.apk"
          test "$(find release-assets -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "release-assets/android-remote-control-mcp-ru-gms-release.apk"
          ls -lh release-assets/

      - name: Upload Russian GMS APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-remote-control-mcp-russian-gms-release
          path: release-assets/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APKs in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Русская версия Android Remote Control MCP для телефонов с Google Play Services, включая Samsung Galaxy.

          Единственный установочный файл: android-remote-control-mcp-ru-gms-release.apk.

          Внимание: APK подписан ключом этого форка, а не оригинального разработчика.
          Без RU_KEYSTORE_* secrets используется временный новый ключ для каждого запуска:
          следующие APK не смогут обновить существующую установку без переустановки.

          NOTES
          if gh release view ru-build > /dev/null 2>&1; then
            gh release edit ru-build --notes-file release-notes.md
            gh release upload ru-build release-assets/*.apk --clobber
          else
            gh release create ru-build release-assets/*.apk \
              --target "$GITHUB_SHA" \
              --title "Android Remote Control MCP — русская сборка" \
              --notes-file release-notes.md \
              --prerelease
          fi

          # Remove previously published Debug/FOSS APKs from the old four-variant workflow.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/ru-build" --jq '.id')"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
            --jq '.[] | select(.name != "android-remote-control-mcp-ru-gms-release.apk") | .id' |
            while read -r asset_id; do
              if [ -n "$asset_id" ]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              fi
            done
